# .NET Desktop
# Build and run tests for .NET Desktop or Windows classic desktop solutions.
# Add steps that publish symbols, save build artifacts, and more:
# https://docs.microsoft.com/azure/devops/pipelines/apps/windows/dot-net

trigger:
- master

pool:
  vmImage: 'windows-2019'

variables:
  solution: 'src/PFXImportPowershell/OnPremValidation/PFXImportOnPremValidation.sln'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'

steps:
- task: NuGetToolInstaller@1

- task: NuGetCommand@2
  inputs:
    restoreSolution: '$(solution)'
    restoreDirectory: 'src/PFXImportPowershell/packages'

- task: VSBuild@1
  inputs:
    solution: '$(solution)'
    platform: '$(buildPlatform)'
    configuration: '$(buildConfiguration)'

- task: VSTest@2
  inputs:
    platform: '$(buildPlatform)'
    configuration: '$(buildConfiguration)'

- powershell: |
    Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser
    $result = Invoke-Pester -Path 'src\PFXImportPowershell\Tests\IntunePfxImport.Tests.ps1' -PassThru
    if ($result.FailedCount -ne 0) { throw "$($result.FailedCount) Windows PowerShell Pester tests failed." }
  displayName: 'Test PFX import module - Windows PowerShell 5.1'

- pwsh: |
    Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser
    $result = Invoke-Pester -Path 'src\PFXImportPowershell\Tests\IntunePfxImport.Tests.ps1' -PassThru
    if ($result.FailedCount -ne 0) { throw "$($result.FailedCount) PowerShell 7 Pester tests failed." }
  displayName: 'Test PFX import module - PowerShell 7'

#- powershell: gci env:* | sort-object name | Format-Table -AutoSize | Out-File $env:BUILD_ARTIFACTSTAGINGDIRECTORY/environment-variables.txt

- task: CopyFiles@2
  inputs:
    sourceFolder: '$(Build.SourcesDirectory)'
    contents: |
      **/OnPremValidation/**/bin/**/$(BuildConfiguration)/**/?(*.exe|*.dll|*.xml|*.pdb)
      **/PFXImportPS/*.psd1
      **/PFXImportPS/*.psm1
      **/Examples/*.ps1
    TargetFolder: '$(Build.ArtifactStagingDirectory)'

- task: CodeSignValidationInjected@1

- task: CredScan@2
  inputs:
    toolMajorVersion: 'V2'